services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
